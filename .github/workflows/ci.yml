name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing_injury_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing_injury_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testing_injury_ai?schema=public
      JWT_SECRET: ci-test-only-jwt-secret
      EMBEDDING_API_KEY: ci-test-only-embedding-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Prepare test environment
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env.test
          echo "JWT_SECRET=$JWT_SECRET" >> .env.test
          echo "EMBEDDING_API_KEY=$EMBEDDING_API_KEY" >> .env.test
          npx prisma db push
          npx prisma db seed

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
